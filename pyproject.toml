[project]
name = "hermes-ai-assistant"
version = "0.1.0"
description = "AI-enhanced Intelligent Assistant built on Hermes TUI"
requires-python = ">=3.11"
dependencies = [
    "hermes-agent",
    "httpx",
    "pydantic",
    "nanostores",
    "react",
    "typing-extensions",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
