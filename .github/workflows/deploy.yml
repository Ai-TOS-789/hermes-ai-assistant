name: Deploy — Hermes AI Assistant

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (staging/production)'
        required: false
        default: 'staging'

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/hermes-ai-assistant' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: env.DEPLOY_HOST != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: pytest tests/ -v

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "🚀 Deploying hermes-ai-assistant..."
            cd ${DEPLOY_PATH}
            git pull origin master
            pip install -e .
            echo "✅ Deploy complete"

      - name: Verify deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${DEPLOY_USER}@${DEPLOY_HOST} "echo 'Deploy OK'"

      - name: Telegram success notification
        if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="✅ *Deploy Success*
          Repo: ${{ github.repository }}
          SHA: ${{ github.sha }}
          Target: ${{ inputs.target || 'staging' }}
          Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="$MSG" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview=true
